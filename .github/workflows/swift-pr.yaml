name: PR

on:
    pull_request:
        branches: [develop]

permissions:
    contents: read

jobs:
    tests:
        name: Validate on ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux
                      os: ubuntu-24.04
                      arch-flag: ""
                    - name: macOS (Apple Silicon)
                      os: macos-latest
                      arch-flag: ""
                    - name: macOS (Intel)
                      os: macos-latest
                      arch-flag: "--arch x86_64"
        steps:
            - uses: actions/checkout@v6
              with:
                submodules: true
            - name: Get swift version
              id: get_swift_version
              run: |
                    v=$(cat .swift-version)
                    echo "swift_version=$v" >> $GITHUB_OUTPUT
            - uses: swift-actions/setup-swift@v3
              with:
                swift-version: ${{ steps.get_swift_version.outputs.swift_version }}
                skip-verify-signature: true
            - name: Verify swift version
              run: |
                    swift --version
            - name: Validate package manifest
              run: |
                    swift package dump-package > /dev/null
            - name: Build
              run: |
                    swift build ${{ matrix.arch-flag }}
            - name: Run tests
              run: |
                    swift test ${{ matrix.arch-flag }}
